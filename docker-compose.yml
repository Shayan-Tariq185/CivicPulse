
services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civicpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: civicpulse-backend
    environment:
      # Use the container names to connect internally
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/civicpulse
      - REDIS_URL=redis://redis:6379/0
      - TRIAGE_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - frontend-network
      - backend-network
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: civicpulse-frontend
    networks:
      - frontend-network
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  # Network for the frontend to reach the backend
  frontend-network:
    driver: bridge
  # Isolated network for backend to reach databases
  backend-network:
    driver: bridge

volumes:
  # Persistent storage volumes
  postgres_data:
  redis_data:
