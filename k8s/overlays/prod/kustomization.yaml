apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Immutable commit-SHA tags only, never :latest. CD (Phase 11) replaces the placeholders.
images:
  - name: civicpulse-backend
    newName: ghcr.io/OWNER/civicpulse-backend
    newTag: GIT_SHA_PLACEHOLDER
  - name: civicpulse-frontend
    newName: ghcr.io/OWNER/civicpulse-frontend
    newTag: GIT_SHA_PLACEHOLDER
