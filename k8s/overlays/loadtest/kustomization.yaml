# dev + a very high rate limit, ONLY for the load test.
# Without this, every request from the Ingress shares one IP and gets 429 after 100/min.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev
patches:
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: add
        path: /data/RATE_LIMIT_PER_MINUTE
        value: "1000000"
