# Runs Alembic once, so two backend replicas never race to migrate.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: { app: db-migrate }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: db-migrate }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: civicpulse-backend
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
