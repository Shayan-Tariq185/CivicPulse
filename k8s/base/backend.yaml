apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: civicpulse-backend
          imagePullPolicy: IfNotPresent
          # migrations run in the db-migrate Job, so start only the server here
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: DATABASE_URL } }
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: GROQ_API_KEY } }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: backend }
